name: Validate static website
on:
  push:
    branches: [TEST, test, site-redesign, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:dom
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: browser-checks/
          if-no-files-found: ignore
